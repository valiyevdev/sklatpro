{% extends 'base.html' %}
{% load i18n_tags %}

{% block title %}{% t "delete" %} - SKLAT PRO{% endblock %}

{% block content %}
<div class="page-head">
    <a href="{% url 'spiskalar:list_list' %}" class="back-btn" aria-label="Orqaga">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
    </a>
    <div class="page-header-content">
        <h1 class="page-title" style="margin:0">{% t "confirm_delete_title" %}</h1>
    </div>
</div>

<div style="max-width:480px;margin:0 auto">
    <div class="card-pro">
        <div class="card-pro-body" style="text-align:center;padding:3rem 2rem">
            <div class="empty-state-icon" style="background:var(--danger-50);color:var(--danger-500);margin:0 auto 1.5rem"><i class="bi bi-exclamation-triangle"></i></div>
            <h3 class="fw-600 mb-2" style="color:var(--gray-900)">{% t "confirm_delete_title" %}</h3>
            <p class="text-pro-muted mb-4"><strong>{{ list.name }}</strong> {% t "this_will_be_deleted" %}</p>
            <form method="post">
                {% csrf_token %}
                <div class="d-flex gap-2" style="justify-content:center">
                    <a href="{% url 'spiskalar:list_list' %}" class="btn-pro btn-pro-secondary">{% t "cancel" %}</a>
                    <button type="submit" class="btn-pro btn-pro-danger"><i class="bi bi-trash"></i> {% t "yes_delete" %}</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
