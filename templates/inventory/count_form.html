{% extends 'base.html' %}
{% load i18n_tags %}

{% block title %}{% t "create_count" %} | SKLAT PRO{% endblock %}

{% block content %}
<div class="page-head">
    <a href="{% url 'count_list' %}" class="back-btn" aria-label="Orqaga">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
    </a>
    <div class="page-header-content">
        <h1 class="page-title" style="margin:0">{% t "create_count" %}</h1>
    </div>
</div>

<div style="max-width:720px">
    <div class="card-pro">
        <div class="card-pro-body">
            <form method="post" class="form-pro">
                {% csrf_token %}
                <div class="input-pro-group">
                    <label class="input-pro-label">{% t "warehouse" %} *</label>
                    {{ form.warehouse }}
                </div>
                <div class="input-pro-group">
                    <label class="input-pro-label">{% t "assigned_to" %}</label>
                    {{ form.assigned_to }}
                </div>
                <div class="input-pro-group">
                    <label class="input-pro-label">{% t "notes" %}</label>
                    {{ form.notes }}
                </div>
                <div class="d-flex justify-between mt-4">
                    <a href="{% url 'count_list' %}" class="btn-pro btn-pro-secondary">{% t "cancel" %}</a>
                    <button type="submit" class="btn-pro btn-pro-primary"><i class="bi bi-check-circle"></i> {% t "create" %}</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
