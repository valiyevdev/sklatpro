    {% load static i18n_tags %}<!DOCTYPE html>
<html lang="{% lang_attrs %}" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% t "password_reset_success" %} — SKLAT PRO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
    <link href="{% static 'css/design-system.css' %}" rel="stylesheet">
    <link href="{% static 'css/auth-pages.css' %}" rel="stylesheet">
</head>
<body>
    <button class="auth-theme-toggle" onclick="toggleAuthTheme()" aria-label="{% t "toggle_theme" %}">
        <i class="bi bi-moon" id="authThemeIcon"></i>
    </button>

    <div class="auth-layout">
        <!-- Hero Panel -->
        <div class="auth-hero">
            <div class="auth-hero-brand">
                <div class="auth-hero-logo">S</div>
                <span style="font-size:var(--text-lg);font-weight:700;letter-spacing:-0.01em">SKLAT PRO</span>
            </div>
            <div class="auth-hero-icon"><i class="bi bi-check-circle"></i></div>
            <h1 class="auth-hero-title">{% t "password_reset_success" %}</h1>
            <p class="auth-hero-desc">{% t "hero_subtitle" %}</p>
        </div>

        <!-- Form Panel -->
        <div class="auth-form-side">
            <!-- Compact top brand header - replaces the hero banner below lg -->
            <div class="pr-mobile-brand">
                <div class="pr-mobile-mark">S</div>
                <div>
                    <span class="pr-mobile-brand-name">SKLAT PRO</span>
                    <span class="pr-mobile-brand-sub">{% t "password_reset_success" %}</span>
                </div>
            </div>

            <div class="auth-form-wrapper">
                <div style="text-align:center;margin-bottom:var(--sp-6)">
                    <div style="width:64px;height:64px;border-radius:var(--radius-xl);background:var(--success-50);color:var(--success-600);display:inline-flex;align-items:center;justify-content:center;font-size:1.75rem;margin-bottom:var(--sp-4)">
                        <i class="bi bi-check-circle-fill"></i>
                    </div>
                    <h2>{% t "password_reset_success" %}</h2>
                    <p class="auth-subtitle" style="margin-top:var(--sp-2)">{% t "password_reset_complete_desc" %}</p>
                </div>

                <a href="{% url 'login' %}" class="auth-btn" style="text-decoration:none;text-align:center">
                    <span class="btn-text">{% t "login" %}</span>
                </a>
            </div>

            <!-- Language Switcher -->
            <div class="auth-lang">
                <div class="lang-switcher" role="group" aria-label="{% t "language" %}">
                    <button class="lang-btn {% if current_language == 'uz' %}active{% endif %}"
                            onclick="setLang('uz')" type="button">UZ</button>
                    <button class="lang-btn {% if current_language == 'uz_cyr' %}active{% endif %}"
                            onclick="setLang('uz_cyr')" type="button">ЎЗ</button>
                    <button class="lang-btn {% if current_language == 'ru' %}active{% endif %}"
                            onclick="setLang('ru')" type="button">RU</button>
                    <button class="lang-btn {% if current_language == 'en' %}active{% endif %}"
                            onclick="setLang('en')" type="button">EN</button>
                </div>
            </div>
        </div>
    </div>

    <script>
    function toggleAuthTheme() {
        var h = document.documentElement;
        var c = h.getAttribute('data-theme') || 'dark';
        var n = c === 'light' ? 'dark' : 'light';
        h.setAttribute('data-theme', n);
        localStorage.setItem('sklat-theme', n);
        document.getElementById('authThemeIcon').className = n === 'dark' ? 'bi bi-sun' : 'bi bi-moon';
    }
    (function() {
        var saved = localStorage.getItem('sklat-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', saved);
        var icon = document.getElementById('authThemeIcon');
        if (icon) icon.className = saved === 'dark' ? 'bi bi-sun' : 'bi bi-moon';
    })();
    function setLang(lang) {
        fetch('/set-language/', {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded', 'X-CSRFToken': '{{ csrf_token }}'},
            body: 'language=' + lang
        }).then(function() { location.reload(); });
    }
    </script>
    <script>
    window.SKLAT_LANG='{{ current_language|default:"uz" }}';
    window.SKLAT_T=JSON.parse('{{ translations_json|escapejs }}');
    window.t=function(key,fallback){return(window.SKLAT_T&&window.SKLAT_T[key])||fallback||key};
    </script>
</body>
</html>
