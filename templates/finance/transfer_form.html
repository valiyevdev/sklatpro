{% extends 'base.html' %}
{% load i18n_tags %}

{% block title %}{% t "fin_new_transfer" %} — SKLAT PRO{% endblock %}

{% block content %}
<div class="page-header">
    <div class="page-header-content">
        <h1 class="page-title">{% t "fin_new_transfer" %}</h1>
    </div>
</div>

<div style="max-width:600px">
    <div class="card-pro">
        <div class="card-pro-body">
            <form method="post">
                {% csrf_token %}
                <div class="input-pro-group">
                    <label class="input-pro-label">{% t "fin_from_account" %} *</label>
                    <select class="form-control" name="from_account" required>
                        <option value="">{% t "fin_select_account" %}</option>
                        {% for acc in accounts %}
                        <option value="{{ acc.pk }}">{{ acc.name }} ({{ acc.get_account_type_display }}) — ${{ acc.current_balance|floatformat:2 }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div style="text-align:center;padding:var(--sp-3) 0">
                    <i class="bi bi-arrow-down" style="font-size:1.5rem;color:var(--primary-500)"></i>
                </div>

                <div class="input-pro-group">
                    <label class="input-pro-label">{% t "fin_to_account" %} *</label>
                    <select class="form-control" name="to_account" required>
                        <option value="">{% t "fin_select_account" %}</option>
                        {% for acc in accounts %}
                        <option value="{{ acc.pk }}">{{ acc.name }} ({{ acc.get_account_type_display }}) — ${{ acc.current_balance|floatformat:2 }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="grid grid-2 gap-4 mt-4">
                    <div class="input-pro-group">
                        <label class="input-pro-label">{% t "amount" %} *</label>
                        <input class="form-control" type="number" name="amount" step="0.01" min="0.01" required placeholder="0.00">
                    </div>
                    <div class="input-pro-group">
                        <label class="input-pro-label">{% t "date" %} *</label>
                        <input class="form-control" type="date" name="date" required value="{{ today|date:'Y-m-d' }}">
                    </div>
                </div>

                <div class="input-pro-group">
                    <label class="input-pro-label">{% t "notes" %}</label>
                    <textarea class="form-control" name="notes" rows="2" placeholder="{% t "fin_transfer_notes_placeholder" %}"></textarea>
                </div>

                <div class="d-flex justify-between">
                    <a href="{% url 'finance:account_list' %}" class="btn-pro btn-pro-secondary"><i class="bi bi-arrow-left"></i> {% t "cancel" %}</a>
                    <button type="submit" class="btn-pro btn-pro-primary"><i class="bi bi-arrow-left-right"></i> {% t "fin_create_transfer" %}</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
