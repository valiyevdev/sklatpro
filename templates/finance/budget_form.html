{% extends 'base.html' %}
{% load i18n_tags %}

{% block title %}{% t "fin_new_budget" %} — SKLAT PRO{% endblock %}

{% block content %}
<div class="page-header">
    <div class="page-header-content">
        <h1 class="page-title">{% t "fin_new_budget" %}</h1>
    </div>
</div>

<div style="max-width:600px">
    <div class="card-pro">
        <div class="card-pro-body">
            <form method="post">
                {% csrf_token %}
                <div class="input-pro-group">
                    <label class="input-pro-label">{% t "fin_name" %} *</label>
                    <input class="form-control" type="text" name="name" required placeholder="{% t "fin_budget_name_placeholder" %}">
                </div>
                <div class="grid grid-2 gap-4">
                    <div class="input-pro-group">
                        <label class="input-pro-label">{% t "fin_category" %} *</label>
                        <select class="form-control" name="category" required>
                            <option value="">{% t "fin_select_category" %}</option>
                            {% for cat in categories %}
                            <option value="{{ cat.pk }}">{{ cat.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="input-pro-group">
                        <label class="input-pro-label">{% t "fin_period" %} *</label>
                        <select class="form-control" name="period_type" required>
                            <option value="monthly">{% t "fin_period_monthly" %}</option>
                            <option value="quarterly">{% t "fin_period_quarterly" %}</option>
                            <option value="annual">{% t "fin_period_annual" %}</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-2 gap-4">
                    <div class="input-pro-group">
                        <label class="input-pro-label">{% t "fin_year" %} *</label>
                        <input class="form-control" type="number" name="year" required value="{{ current_year }}">
                    </div>
                    <div class="input-pro-group">
                        <label class="input-pro-label">{% t "fin_month" %}</label>
                        <input class="form-control" type="number" name="month" min="1" max="12" value="{{ current_month }}">
                    </div>
                </div>
                <div class="input-pro-group">
                    <label class="input-pro-label">{% t "fin_planned_amount" %} *</label>
                    <input class="form-control" type="number" name="planned_amount" step="0.01" min="0" required placeholder="0.00">
                </div>
                <div class="input-pro-group">
                    <label class="input-pro-label">{% t "notes" %}</label>
                    <textarea class="form-control" name="notes" rows="2"></textarea>
                </div>
                <div class="d-flex justify-between">
                    <a href="{% url 'finance:budget_list' %}" class="btn-pro btn-pro-secondary"><i class="bi bi-arrow-left"></i> {% t "cancel" %}</a>
                    <button type="submit" class="btn-pro btn-pro-primary"><i class="bi bi-check-circle"></i> {% t "fin_create_budget" %}</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
